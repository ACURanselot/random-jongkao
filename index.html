<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>랜덤 종카어 생성기</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f5f5f5;
    font-family: Arial, sans-serif;
  }
  .box {
    width: min(700px, 92vw);
    background: white;
    padding: 28px;
    border-radius: 18px;
    box-shadow: 0 8px 30px #00000012;
  }
  h1 { margin: 0 0 20px; font-size: 24px; }
  .row {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }
  input {
    flex: 1;
    min-width: 0;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
  }
  button {
    border: 0;
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 15px;
    cursor: pointer;
    background: #222;
    color: white;
  }
  button:hover { opacity: .85; }
  #result {
    width: 100%;
    min-height: 150px;
    padding: 16px;
    border: 1px solid #ddd;
    border-radius: 12px;
    background: #fafafa;
    font-size: 24px;
    line-height: 1.5;
    word-break: break-all;
    white-space: pre-wrap;
  }
  .hint { color: #777; font-size: 13px; margin-top: 10px; }
</style>
</head>
<body>
  <main class="box">
    <h1>랜덤 종카어 생성기</h1>

    <div class="row">
      <input id="count" type="number" min="1" max="100000" value="100" placeholder="글자 수">
      <button onclick="generate()">생성</button>
      <button onclick="copyResult()">복사</button>
    </div>

    <div id="result"></div>
    <div class="hint">사용 문자: ㍰ ⣿ ■</div>
  </main>

<script>
const chars = ["㍰", "⣿", "■"];

function generate() {
  const count = Math.max(1, Math.min(100000, Number(document.getElementById("count").value) || 1));
  let result = "";
  for (let i = 0; i < count; i++) {
    result += chars[Math.floor(Math.random() * chars.length)];
  }
  document.getElementById("result").textContent = result;
}

async function copyResult() {
  const text = document.getElementById("result").textContent;
  if (!text) generate();
  const value = document.getElementById("result").textContent;
  try {
    await navigator.clipboard.writeText(value);
    alert("복사되었습니다!");
  } catch {
    const area = document.createElement("textarea");
    area.value = value;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
    alert("복사되었습니다!");
  }
}

generate();
</script>
</body>
</html>
